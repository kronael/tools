---
# ast-grep config for the kronael lint pack. Rules are co-located with the
# language skill that owns them (skills/<lang>/lints/); list each dir here.
# The fixture harness (skills/astgrep/check.py, `make lints`) proves every rule.
ruleDirs:
    - skills/ts/lints
    - skills/rs/lints
    - skills/py/lints
    - skills/sh/lints
