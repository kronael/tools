---
id: py-except-var-e
language: python
severity: warning
rule:
    kind: identifier
    regex: ^e$
    inside:
        kind: as_pattern_target
message: NEVER name an as-alias e (except/with) — use ex, exc, or err. See skill:py.
note: 'source: skills/py/SKILL.md — Style'
---
id: py-no-lambda-default-factory
language: python
severity: warning
rule:
    kind: lambda
    inside:
        kind: keyword_argument
        has:
            field: name
            regex: ^default_factory$
message: 'NEVER default_factory=lambda: [] — use default_factory=list or the parametrized type. See skill:py.'
note: 'source: skills/py/SKILL.md — Type Annotations'
---
id: py-no-property
language: python
severity: warning
rule:
    pattern: '@property'
message: NEVER @property / @setter / __getattr__ (except mocks, adapting external APIs, or a record's value derived from its own fields) — use a plain method.
    See skill:py.
note: 'source: skills/py/SKILL.md — Properties and accessor overrides'
---
id: py-bool-fn-prefix
language: python
severity: warning
ignores:
    - '**/test_*.py'
    - '**/*_test.py'
    - '**/conftest.py'
    - '**/tests/**'
rule:
    kind: function_definition
    has:
        field: return_type
        regex: ^(bool|'bool'|"bool"|(\w+\.)*(TypeGuard|TypeIs)\[[\s\S]*\])$
    not:
        any:
            - has:
                  field: name
                  regex: ^_*(is|has|can|should)_|^__\w+__$|^test(_|$)
            - inside:
                  kind: decorated_definition
                  has:
                      kind: decorator
                      has:
                          any:
                              - kind: identifier
                                regex: ^override$
                              - kind: attribute
                                regex: \.override$
message: 'NEVER a -> bool, TypeGuard or TypeIs function without an is_/has_/can_/should_ prefix — rename it, valid() → is_valid(). Leading underscores before
    the prefix are allowed. Exempt: dunders, @override methods, pytest test/test_* functions, test files and tests/ dirs. See skill:py.'
note: 'source: skills/software/code.md — Naming'
---
id: py-no-str-case-dispatch
language: python
severity: warning
rule:
    kind: match_statement
    has:
        stopBy: end
        kind: case_clause
        has:
            kind: case_pattern
            any:
                - has:
                      kind: string
                - has:
                      kind: union_pattern
                      has:
                          kind: string
message: NEVER match on a kind string (case 'kline1m/1':) — parse it to one dataclass per variant or an Enum member at the boundary and match on the class
    (case Kline1m():). See skill:py.
note: 'source: skills/py/SKILL.md — Named Data Structures; skills/software/code.md — Design'
---
id: py-no-dict-call
language: python
severity: warning
rule:
    kind: call
    has:
        field: function
        regex: ^dict$
    not:
        any:
            - has:
                  field: arguments
                  has:
                      pattern: $ARG
                      not:
                          kind: keyword_argument
            - inside:
                  kind: argument_list
                  stopBy: end
message: "NEVER dict(a=1) for a value built in place — write the {'a': 1} literal, or an Enum for a closed set of names. Allowed only as a call argument,\
    \ f(extra=dict(a=1)). See skill:py."
note: 'source: skills/py/SKILL.md — Style'
