---
id: py-except-var-e
language: python
severity: warning
rule:
    kind: identifier
    regex: ^e$
    inside:
        kind: as_pattern_target
        inside:
            kind: as_pattern
            inside:
                kind: except_clause
message: NEVER name an exception e — use ex, exc, or err. See skill:py.
note: 'source: skills/py/SKILL.md — Style'
---
id: py-no-lambda-default-factory
language: python
severity: warning
rule:
    kind: lambda
    not:
        has:
            field: parameters
            regex: .
    has:
        field: body
        any:
            - pattern: '[]'
            - pattern: '{}'
    inside:
        kind: keyword_argument
        has:
            field: name
            regex: ^default_factory$
message: Use list or dict as the empty collection default_factory, including parametrized types. See skill:py.
note: 'source: skills/py/SKILL.md — Type Annotations'
---
id: py-bool-fn-prefix
language: python
severity: warning
ignores:
    - '**/test_*.py'
    - '**/*_test.py'
    - '**/conftest.py'
    - '**/tests/**'
rule:
    kind: function_definition
    has:
        field: return_type
        regex: ^(bool|'bool'|"bool"|(\w+\.)*(TypeGuard|TypeIs)\[[\s\S]*\])$
    not:
        any:
            - has:
                  field: name
                  regex: ^_*(is|has|can|should)_|^__\w+__$|^test(_|$)
            - inside:
                  kind: decorated_definition
                  has:
                      kind: decorator
                      has:
                          any:
                              - kind: identifier
                                regex: ^override$
                              - kind: attribute
                                regex: \.override$
message: 'NEVER a -> bool, TypeGuard or TypeIs function without an is_/has_/can_/should_ prefix — rename it, valid() → is_valid(). Leading underscores before
    the prefix are allowed. Exempt: dunders, @override methods, pytest test/test_* functions, test files and tests/ dirs. See skill:py.'
note: 'source: skills/software/code.md — Naming'
---
id: py-no-dict-call
language: python
severity: warning
rule:
    kind: call
    has:
        field: function
        regex: ^dict$
    not:
        any:
            - has:
                  field: arguments
                  has:
                      pattern: $ARG
                      not:
                          kind: keyword_argument
            - inside:
                  kind: argument_list
                  stopBy:
                      not:
                          kind: parenthesized_expression
                  inside:
                      kind: call
            - inside:
                  kind: keyword_argument
                  stopBy:
                      not:
                          kind: parenthesized_expression
                  inside:
                      kind: argument_list
                      inside:
                          kind: call
message: "NEVER dict(a=1) for a value built in place — write the {'a': 1} literal, or an Enum for a closed set of names. Allowed only as a call argument,\
    \ f(extra=dict(a=1)). See skill:py."
note: 'source: skills/py/SKILL.md — Style'
---
id: py-no-enum-auto
language: python
severity: warning
rule:
    kind: call
    any:
        - pattern: auto()
        - pattern: enum.auto()
    inside:
        kind: assignment
        stopBy:
            not:
                any:
                    - kind: tuple
                    - kind: parenthesized_expression
                    - kind: expression_list
        inside:
            kind: expression_statement
            inside:
                kind: block
                inside:
                    kind: class_definition
                    has:
                        field: superclasses
                        has:
                            regex: ^(enum\.)?(Enum|IntEnum|StrEnum|Flag|IntFlag)$
message: NEVER an Enum member = auto() — write the value, LIVE = 1. See skill:py.
note: 'source: skills/py/SKILL.md — Type Annotations'
---
id: py-no-type-checking-imports
language: python
severity: warning
utils:
    type-checking:
        regex: ^[\s(]*(typing\.)?TYPE_CHECKING[\s)]*$
    not-type-checking:
        regex: ^[\s(]*not[\s(]+(typing\.)?TYPE_CHECKING[\s)]*$
    type-only-condition:
        any:
            - matches: type-checking
            - all:
                  - any:
                        - kind: parenthesized_expression
                        - pattern: $LEFT and $RIGHT
                  - has:
                        matches: type-checking
                        stopBy:
                            not:
                                any:
                                    - kind: parenthesized_expression
                                    - pattern: $LEFT and $RIGHT
rule:
    any:
        - kind: import_statement
        - kind: import_from_statement
    inside:
        kind: block
        stopBy: end
        any:
            - inside:
                  any:
                      - kind: if_statement
                      - kind: elif_clause
                  has:
                      field: condition
                      matches: type-only-condition
            - inside:
                  kind: else_clause
                  any:
                      - inside:
                            kind: if_statement
                            has:
                                field: condition
                                matches: not-type-checking
                      - follows:
                            kind: elif_clause
                            has:
                                field: condition
                                matches: not-type-checking
message: Keep imports available at runtime; NEVER put them under TYPE_CHECKING. See skill:py.
note: 'source: skills/py/SKILL.md — Type Annotations'
---
id: py-no-typeddict
language: python
severity: warning
rule:
    any:
        - kind: class_definition
          has:
              field: superclasses
              has:
                  regex: ^((typing|typing_extensions)\.)?TypedDict$
        - kind: call
          has:
              field: function
              regex: ^((typing|typing_extensions)\.)?TypedDict$
message: Use a dataclass for an application-owned record; NEVER declare a TypedDict. See skill:py.
note: 'source: skills/py/SKILL.md — Named Data Structures'
---
id: py-no-namedtuple
language: python
severity: warning
rule:
    any:
        - kind: class_definition
          has:
              field: superclasses
              has:
                  regex: ^((typing|typing_extensions)\.)?NamedTuple$
        - kind: call
          has:
              field: function
              regex: ^((typing|typing_extensions)\.)?NamedTuple$
message: Use a frozen dataclass with slots for a record; NEVER declare a NamedTuple. See skill:py.
note: 'source: skills/py/SKILL.md — Named Data Structures'
---
id: py-log-name
language: python
severity: warning
rule:
    kind: assignment
    has:
        field: left
        kind: identifier
        not:
            regex: ^log$
    all:
        - has:
              field: right
              pattern: logging.getLogger($$$)
message: Name the logging.getLogger binding log. See skill:py.
note: 'source: skills/py/SKILL.md — Logging'
---
id: py-no-tuple-assignment
language: python
severity: warning
rule:
    kind: assignment
    has:
        field: left
        any:
            - kind: pattern_list
            - kind: tuple_pattern
    all:
        - has:
              field: right
              any:
                  - kind: expression_list
                  - kind: tuple
message: Assign independent values on separate lines; NEVER a, b = x, y. Unpacking one returned value is allowed. See skill:py.
note: 'source: skills/py/SKILL.md — Style'
---
id: py-typeadapter-module-level
language: python
severity: warning
rule:
    kind: call
    has:
        field: function
        regex: ^(pydantic\.)?TypeAdapter(\[.*\])?$
    inside:
        kind: function_definition
        stopBy: end
message: Build a pydantic TypeAdapter once as a module-level constant; NEVER inside a function, where every call compiles a new validator. See skill:py.
note: 'source: skills/py/SKILL.md — Named Data Structures'
---
id: py-no-conditional-none-return
language: python
severity: warning
rule:
    kind: return_statement
    has:
        kind: conditional_expression
        stopBy:
            not:
                kind: parenthesized_expression
        has:
            kind: none
message: NEVER return a conditional expression that yields None — guard first, if not row return None, then return the value plainly. See skill:py.
note: 'source: skills/py/SKILL.md — Style'
