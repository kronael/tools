---
id: rs-no-unwrap
language: rust
severity: warning
ignores:
    - '**/*_test.rs'
    - '**/tests/**'
rule:
    pattern: $X.unwrap()
    not:
        any:
            - follows:
                  kind: line_comment
                  stopBy: neighbor
            - inside:
                  follows:
                      kind: line_comment
                      stopBy: neighbor
                  stopBy: end
message: NEVER bare .unwrap() in non-test code — use .expect("why"), propagate with ?, or justify it with a // comment on the line directly above. Tests
    are exempt. See skill:rs.
note: 'source: skills/rs/SKILL.md — Unwrap Safety'
---
id: rs-no-from-value-clone
language: rust
severity: warning
rule:
    any:
        - pattern: serde_json::from_value($X.clone())
        - pattern: serde_json::from_value::<$T>($X.clone())
message: NEVER from_value(x.clone()) — &Value is a Deserializer; use T::deserialize(x), no clone. See skill:rs.
note: 'source: skills/rs/SKILL.md — serde_json Value'
---
id: rs-no-anon-spawn
language: rust
severity: warning
rule:
    any:
        - pattern: tokio::spawn(async { $$$ })
        - pattern: tokio::spawn(async move { $$$ })
        - pattern: spawn(async { $$$ })
        - pattern: spawn(async move { $$$ })
message: NEVER anonymous spawn(async {…}) — name the coroutine as an async fn and spawn that. See skill:rs.
note: 'source: skills/rs/SKILL.md — Async Spawn'
