---
id: rs-no-unwrap
language: rust
severity: warning
ignores:
    - '**/*_test.rs'
    - '**/tests/**'
rule:
    pattern: $X.unwrap()
    not:
        any:
            - follows:
                  kind: line_comment
                  stopBy: neighbor
            - inside:
                  follows:
                      kind: line_comment
                      stopBy: neighbor
                  stopBy: end
message: NEVER bare .unwrap() in non-test code — use .expect("why"), propagate with ?, or justify it with a // comment on the line directly above. Tests
    are exempt. See skill:rs.
note: 'source: skills/rs/SKILL.md — Unwrap Safety'
---
id: rs-no-from-value-clone
language: rust
severity: warning
rule:
    any:
        - pattern: serde_json::from_value($X.clone())
        - pattern: serde_json::from_value::<$T>($X.clone())
message: NEVER from_value(x.clone()) — &Value is a Deserializer; use T::deserialize(x), no clone. See skill:rs.
note: 'source: skills/rs/SKILL.md — serde_json Value'
---
id: rs-no-anon-spawn
language: rust
severity: warning
rule:
    any:
        - pattern: tokio::spawn(async { $$$ })
        - pattern: tokio::spawn(async move { $$$ })
        - pattern: spawn(async { $$$ })
        - pattern: spawn(async move { $$$ })
message: NEVER anonymous spawn(async {…}) — name the coroutine as an async fn and spawn that. See skill:rs.
note: 'source: skills/rs/SKILL.md — Async Spawn'
---
id: rs-bool-fn-prefix
language: rust
severity: warning
ignores:
    - '**/*_test.rs'
    - '**/tests.rs'
    - '**/tests/**'
utils:
    test-item:
        follows:
            kind: attribute_item
            regex: ^#\[\s*((\w+::)*(test|rstest|test_case)\s*[(\]]|cfg\(\s*(all\(\s*)?test\b)
            stopBy:
                not:
                    any:
                        - kind: attribute_item
                        - kind: line_comment
                        - kind: block_comment
rule:
    kind: function_item
    has:
        field: return_type
        kind: primitive_type
        regex: ^bool$
    not:
        any:
            - has:
                  field: name
                  regex: ^(is|has|can|should)_
            - matches: test-item
            - inside:
                  stopBy: end
                  any:
                      - matches: test-item
                      - kind: impl_item
                        has:
                            field: trait
                            regex: .
                      - kind: mod_item
                        has:
                            field: name
                            regex: ^tests?$
message: 'NEVER a bool-returning fn without an is_/has_/can_/should_ prefix — rename it, valid() → is_valid(). Exempt: trait impls, #[test]/#[<crate>::test]/#[rstest]/#[test_case]
    fns, anything under #[cfg(test)] or #[cfg(all(test, …))], mod test/tests, tests/ dirs, tests.rs and *_test.rs files. See skill:rs.'
note: 'source: skills/software/code.md — Naming. #[cfg(any(test, …))] stays flagged: it also builds outside tests.'
