---
default_language_version:
    python: python3

repos:

    - repo: local
      hooks:
          - id: skill-frontmatter
            name: lint skills (frontmatter, body rules, sibling reach) + leak scan
            entry: python hooks/skill_frontmatter_lint.py --write --fail-on-write
            language: python
            additional_dependencies: [PyYAML]
            files: \.md$
            pass_filenames: true
          - id: py-no-module-path
            name: 'py-no-module-path: no path derived from __file__'
            language: python
            additional_dependencies: [ast-grep-cli==0.51.0]
            entry: ast-grep scan --rule skills/py/lints/rules.yml --off --error=py-no-module-path --error=py-no-module-path-ignore
            types: [python]
            exclude: ^skills/py/lints/fixtures/

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
          - id: check-json
          - id: check-yaml
            args: [--allow-multiple-documents]   # ast-grep rule packs = one doc per rule
          - id: check-toml
          - id: check-symlinks
          - id: trailing-whitespace
            exclude: ^skills/create/    # ported bundle data, kept verbatim
          - id: mixed-line-ending
            args: [--fix=lf]
            exclude: ^skills/create/

    - repo: https://github.com/charliermarsh/ruff-pre-commit
      rev: v0.12.1
      hooks:
          - id: ruff
            args: [--fix, --exit-non-zero-on-fix]
          - id: ruff-format

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt
