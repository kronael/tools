---
name: Test — bhctl

on:
    push:
        paths: [bhctl/**]
    pull_request:
        branches: [master]

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - run: make -C bhctl test
            - run: bash tests/drift_test.sh
