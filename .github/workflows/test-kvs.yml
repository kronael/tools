---
name: Test — kvs

on:
    push:
        paths: [kvs/**]
    pull_request:
        branches: [master]

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: kvs/go.mod
            - run: cd kvs && go test ./...
            - run: cd kvs && go vet ./...
